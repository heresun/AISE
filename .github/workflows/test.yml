name: AISE Test Matrix

# v3.3 P0-1：跨平台 CI 矩阵（spike-2-compatibility.md / spike-3-summary.md 承诺）
# - 主 job：3 平台 × 2 Python 版本跑核心 Python 单元测试
# - 各 pipe runner 端到端 job 仅在 Linux + macOS 跑（Windows 一些 runner 装机复杂，
#   后续按需扩展）

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# 所有 job 强制 UTF-8 stdio（Windows 默认 cp1252 会让中文 stderr / argparse 报错）
env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

jobs:
  # ------------------------------------------------------------
  # 核心 Python 单元测试（跨平台）
  # ------------------------------------------------------------
  python-unit:
    name: Python unit (${{ matrix.os }} · py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install pytest
        run: pip install pytest
      - name: Run Python unit tests (no pipe-specific deps)
        shell: bash
        run: |
          python -m pytest tests/ \
            --ignore=tests/test_spike1_acceptance.py \
            --ignore=tests/test_spike2_acceptance.py \
            --ignore=tests/test_spike3_pytest_acceptance.py \
            --ignore=tests/test_spike3_jest_acceptance.py \
            --ignore=tests/test_spike3_cargo_acceptance.py \
            --ignore=tests/fixtures \
            -v

  # ------------------------------------------------------------
  # Spike-1 Go runner（Linux + macOS）
  # ------------------------------------------------------------
  spike1-go:
    name: Spike-1 Go pipe (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Install go-junit-report
        run: go install github.com/jstemmer/go-junit-report/v2@latest
      - name: Install pytest
        run: pip install pytest
      - name: Add Go bin to PATH
        run: echo "$HOME/go/bin" >> $GITHUB_PATH
      - name: Run Spike-1 acceptance
        run: python -m pytest tests/test_spike1_acceptance.py -v

  # ------------------------------------------------------------
  # Spike-2 Maven runner（仅 Linux，mvn 慢）
  # ------------------------------------------------------------
  spike2-maven:
    name: Spike-2 Maven pipe (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
      - name: Install Maven
        run: sudo apt-get update && sudo apt-get install -y maven
      - name: Install pytest
        run: pip install pytest
      - name: Run Spike-2 acceptance
        run: python -m pytest tests/test_spike2_acceptance.py -v
        timeout-minutes: 15

  # ------------------------------------------------------------
  # Spike-3 pytest runner（跨平台）
  # ------------------------------------------------------------
  spike3-pytest:
    name: Spike-3 pytest pipe (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pytest
        run: pip install pytest
      - name: Run Spike-3 pytest acceptance
        run: python -m pytest tests/test_spike3_pytest_acceptance.py -v

  # ------------------------------------------------------------
  # Spike-3 jest runner（Linux + macOS）
  # ------------------------------------------------------------
  spike3-jest:
    name: Spike-3 Jest pipe (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install pytest
        run: pip install pytest
      - name: Install jest fixture dependencies
        working-directory: tests/fixtures/jest-sample
        run: npm install --no-audit --no-fund
      - name: Run Spike-3 jest acceptance
        run: python -m pytest tests/test_spike3_jest_acceptance.py -v

  # ------------------------------------------------------------
  # Spike-3 cargo runner（Linux + macOS）
  # ------------------------------------------------------------
  spike3-cargo:
    name: Spike-3 Cargo pipe (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo2junit
        run: cargo install cargo2junit
      - name: Install pytest
        run: pip install pytest
      - name: Run Spike-3 cargo acceptance
        run: python -m pytest tests/test_spike3_cargo_acceptance.py -v
